name: CI

on:
  push:
    branches: [main, "copilot/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, type check, test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sketchgit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sketchgit_test
      AUTH_SECRET: ci-test-secret-do-not-use-in-production-padding
      NEXTAUTH_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is required so that commitlint can reach the PR base
          # SHA when running `--from github.event.pull_request.base.sha`.
          # A shallow clone (depth=1) only contains HEAD and cannot resolve the
          # base ref, causing "fatal: Invalid revision range".
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: License compliance check
        run: node scripts/check-licenses.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Collect coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: Build Next.js
        run: npm run build

      # ─── P083: fast load-test smoke check (pre-merge, catches gross regressions) ──
      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start server for load-test smoke check
        run: |
          NODE_ENV=production nohup node_modules/.bin/tsx server.ts > /tmp/ci-server.log 2>&1 &
          echo $! > /tmp/ci-server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/api/ready && break
            sleep 1
          done
        env:
          PORT: 3100
          NEXTAUTH_URL: http://localhost:3100

      - name: Run k6 smoke test
        run: k6 run -e BASE_URL=http://localhost:3100 load-tests/smoke.js

      - name: Stop load-test smoke server
        if: always()
        run: kill $(cat /tmp/ci-server.pid) 2>/dev/null || true

  # ─── P082: Accessibility audit (axe-core via Playwright) ─────────────────────
  a11y:
    name: Accessibility audit (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sketchgit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sketchgit_test
      AUTH_SECRET: ci-test-secret-do-not-use-in-production-padding
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run accessibility audit
        run: npx playwright test --project=a11y

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-report
          path: playwright-report/

  # ─── P087: Visual regression testing (axe-core sibling: pixel snapshots) ─────
  visual:
    name: Visual regression (Playwright snapshots)
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    # Baseline snapshots in e2e/visual/**/*-snapshots/ were generated inside
    # this exact image. Screenshot comparison is sensitive to font rendering
    # and anti-aliasing, which differ across OS/GPU — running the job in the
    # same container the baselines came from is the only way to get a
    # meaningful (not flaky-by-construction) diff. Keep this tag in sync with
    # @playwright/test's version in package.json; bump both together and
    # regenerate baselines when either changes.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sketchgit_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Job runs inside `container:`, so services are reachable by service
      # name on the shared Docker network, not `localhost`.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sketchgit_test
      AUTH_SECRET: ci-test-secret-do-not-use-in-production-padding
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run visual regression tests
        run: npx playwright test --project=visual

      - name: Upload visual diff report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-report
          path: playwright-report/

  # ─── P045: Verify the Dockerfile builds successfully ─────────────────────────
  docker-build:
    name: Verify Docker build
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sketchgit:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy

  # ─── P045: Scan Docker image and npm deps for CVEs ───────────────────────────
  trivy-scan:
    name: Container & dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sketchgit:scan
          load: true
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy

      - name: Run Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: sketchgit:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run Trivy filesystem scan (npm deps)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  # ─── P083: Load and stress testing (k6) ───────────────────────────────────────
  # Runs against the full Docker Compose stack (app + PgBouncer + Redis + Postgres)
  # so results reflect the pooled-connection topology used in production, not the
  # bare `postgres` service the main `ci` job uses for unit tests. Post-merge only
  # (and manually via workflow_dispatch) — not a PR merge gate — because a
  # representative run takes minutes, not seconds; see the fast smoke check in the
  # `ci` job above for the pre-merge signal.
  load-test:
    name: Load & stress test (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/ready && exit 0
            sleep 2
          done
          echo "App did not become ready in time" >&2
          docker compose logs app
          exit 1

      - name: Seed load-test data
        run: npx tsx load-tests/seed.ts
        env:
          DATABASE_URL: postgres://sketchgit:dev_password@localhost:5433/sketchgit?pgbouncer=true

      - name: Run k6 scenarios
        run: |
          set -e
          k6 run --summary-export=load-tests/smoke-summary.json load-tests/smoke.js
          k6 run --summary-export=load-tests/commits-api-summary.json load-tests/scenarios/commits-api.js
          k6 run --summary-export=load-tests/ws-room-summary.json -e WS_URL=ws://localhost:3000/ws load-tests/scenarios/ws-room.js
          k6 run --summary-export=load-tests/auth-ratelimit-summary.json load-tests/scenarios/auth-ratelimit.js
        env:
          BASE_URL: http://localhost:3000

      - name: Upload k6 summaries
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summaries
          path: load-tests/*-summary.json

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs app

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
