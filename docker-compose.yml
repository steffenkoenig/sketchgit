services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sketchgit
      POSTGRES_USER: sketchgit
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketchgit -d sketchgit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # P012: Redis Pub/Sub for horizontal scalability across multiple app instances
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # P060: PgBouncer transaction-mode pooling. Caps real PostgreSQL connections
  # to DEFAULT_POOL_SIZE regardless of how many app replicas or per-replica
  # Prisma pool connections sit in front of it. The app connects here
  # (DATABASE_URL); `prisma migrate deploy` connects directly to `db`
  # (DATABASE_DIRECT_URL) since transaction-mode pooling doesn't support the
  # session-scoped multi-statement transactions migrations issue.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sketchgit:dev_password@db:5432/sketchgit
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      # Grants `sketchgit` access to PgBouncer's admin console (SHOW POOLS,
      # SHOW STATS) via the virtual `pgbouncer` database — used by the
      # healthcheck below and useful for connection-pool observability.
      ADMIN_USERS: sketchgit
      # Ratio: 200 client connections share 20 real PostgreSQL connections
      # (10:1). Tune based on observed p99 transaction duration.
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=dev_password psql -h localhost -p 5432 -U sketchgit -d pgbouncer -c 'SHOW POOLS;' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # P061: Local OTLP collector + UI for OpenTelemetry traces. Optional — only
  # useful when `app`'s OTEL_EXPORTER_OTLP_ENDPOINT is set (see .env.example).
  # UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Routed through PgBouncer (transaction-mode pooling).
      DATABASE_URL: postgres://sketchgit:dev_password@pgbouncer:5432/sketchgit?pgbouncer=true
      # Direct connection for `prisma migrate deploy`, bypassing PgBouncer.
      DATABASE_DIRECT_URL: postgres://sketchgit:dev_password@db:5432/sketchgit
      # PgBouncer already multiplexes connections; keep Prisma's own pool small.
      DATABASE_POOL_SIZE: "2"
      NEXTAUTH_URL: http://localhost:3000
      # IMPORTANT: Replace with a real secret generated via: openssl rand -base64 32
      AUTH_SECRET: dev-secret-change-in-production
      NODE_ENV: production
      # P012: Redis URL for horizontal scalability (optional – remove to run single-instance)
      REDIS_URL: redis://redis:6379
      # P061: uncomment to send traces/metrics to the local Jaeger instance above.
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Run Prisma migrations then start the server
    command: >
      sh -c "npx prisma migrate deploy && node_modules/.bin/tsx server.ts"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
